
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire maman</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Corps */
        body {
            background: linear-gradient(135deg, #1a1a2e, #162447);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        /* Conteneur du formulaire */
        .container {
            background: rgba(0,0,0,0.85);
            padding: 40px 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(108,92,231,0.5);
            border: 2px solid #6c5ce7;
        }

        /* Titre */
        .container h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            color: #6c5ce7;
            text-shadow: 0 0 10px #6c5ce7;
        }

        /* Form group */
        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        /* Inputs */
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 2px solid #444;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 10px #6c5ce7;
            outline: none;
        }

        /* Placeholder animé */
        .form-group input::placeholder {
            color: #bbb;
            transition: 0.3s;
        }
        .form-group input:focus::placeholder {
            color: #fff;
        }

        /* Labels flottants */
        .form-group label {
            position: absolute;
            top: 12px;
            left: 15px;
            pointer-events: none;
            color: #bbb;
            transition: 0.3s;
        }

        .form-group input:focus + label,
        .form-group input:not(:placeholder-shown) + label {
            top: -10px;
            left: 10px;
            font-size: 12px;
            color: #6c5ce7;
            background: rgba(0,0,0,0.85);
            padding: 0 5px;
        }

        /* Bouton futuriste */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.4s;
            box-shadow: 0 5px 15px rgba(108,92,231,0.4);
        }

        button:hover {
            background: linear-gradient(45deg, #a29bfe, #6c5ce7);
            box-shadow: 0 5px 20px rgba(108,92,231,0.7);
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 450px) {
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Inscription Mère</h1>
        <form action="maman.html">
            <div class="form-group">
                <input type="text" id="nom" name="nom" placeholder="Entrer le nom de votre mère" required>
                
            </div>

            <div class="form-group">
                <input type="text" id="prenom" name="prenom" placeholder="Entrez le prenom de votre mère svp " required>
                
            </div>

            <div class="form-group">
                <input type="text" id="profession" name="profession" placeholder="Entrez la votre profession de votre mère svp " required>
                
            </div>

            <div class="form-group">
                <input type="text" id="contact" name="contact" placeholder="Entrez le contact de votre mère svp " required>
                
            </div>

            <div class="form-group">
                <input type="text" id="residence" name="residence" placeholder="Entrez le lieu de résidence de votre mère svp " required>
            </div>

            <button type="submit" class="btn btn-success"><a href="tuteur.html"></a>
            <i class="bi bi-arrow-right-circle"></i>Suivant</a></button>
        </form>
    </div>
</body>
