<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulaire Étudiant</title>
  <!-- Lien vers Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Icônes Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h4><i class="bi bi-person-fill"></i> Formulaire Étudiant</h4>
      </div>
      <div class="card-body">
        <form>
          <div class="mb-3">
            <label for="nom" class="form-label">Nom</label>
            <input type="text" id="nom" name="nom" class="form-control" placeholder="Entrez votre nom">
          </div>

          <div class="mb-3">
            <label for="prenom" class="form-label">Prénom</label>
            <input type="text" id="prenom" name="prenom" class="form-control" placeholder="Entrez votre prénom">
          </div>

          <div class="mb-3">
            <label for="age" class="form-label">Âge</label>
            <input type="number" id="age" name="age" class="form-control" placeholder="Entrez votre âge">
          </div>

          <div class="mb-3">
            <label for="filiere" class="form-label">Filière</label>
            <input type="text" id="filiere" name="filiere" class="form-control" placeholder="Ex: Informatique">
          </div>
          <a href="maman.html">
            <button type="submit" class="btn btn-success">
            Suivant <i class="bi bi-arrow-right-circle"></i>
          </button>
          </a>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
