<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulaire Tuteur</title>
  <!-- Lien vers Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Icônes Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h4><i class="bi bi-person-fill"></i> Formulaire TUTEUR</h4>
      </div>
      <div class="card-body">
        <form action="" method="post">
          <div class="mb-3">
            <label for="nom" class="form-label">Nom</label>
            <input type="text" id="nom" name="nom" class="form-control" placeholder="Entrez votre nom" required>
          </div>

          <div class="mb-3">
            <label for="prenom" class="form-label">Prénom</label>
            <input type="text" id="prenom" name="prenom" class="form-control" placeholder="Entrez votre prénom" required>
          </div>

          <div class="mb-3">
            <label for="lieu" class="form-label">Lieu d'habitation</label>
            <input type="text" id="lieu" name="lieu" class="form-control" placeholder="Entrez votre lieu d'habitation">
          </div>
           
          <div class="mb-3">
            <label for="contact" class="form-label">Contact</label>
            <input type="tel" id="contact" name="contact" class="form-control" placeholder="Entrez votre contact">
          </div>

          <button type="submit" class="btn btn-success">
            inscrire <i class="bi bi-arrow-right-circle"></i>
          </button>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
